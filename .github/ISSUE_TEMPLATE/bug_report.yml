name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Never paste your Bing API key or access tokens here.** For security issues, use private reporting (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead. Include the tool name and the error text if any.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: "Claude Desktop (.mcpb) / Claude Desktop (manual config) / Claude Code / other"
  - type: input
    id: version
    attributes:
      label: Version (Claude Desktop → Extensions, or `npx bing-webmaster-tools-mcp --version`)
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Claude Desktop → Settings → Developer → logs for this server, with any keys removed.
      render: text
