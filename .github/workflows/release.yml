name: Release

# Push a tag like v1.0.1 (matching package.json) to publish:
#   - a GitHub Release with the .mcpb extension attached (one-click install in Claude Desktop)
#   - the npm package, if an NPM_TOKEN secret is configured
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }

      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run pack

      - uses: softprops/action-gh-release@v2
        with:
          files: bing-webmaster-tools-mcp-*.mcpb
          generate_release_notes: true

      - name: Publish to npm
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
